{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2 class="text-warning">👥 Registered Users</h2>
  <table class="table table-dark table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Admin?</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.email }}</td>
        <td>{{ "✅ Yes" if user.is_admin else "❌ No" }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
